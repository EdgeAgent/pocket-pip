; Pocket Pip — firmware for the M5Stack StopWatch (M5Stack part C152)
;
; BOARD CHOICE (read this before changing):
;   There is no official "m5stack-stopwatch" board definition in the
;   PlatformIO registry yet. The StopWatch is an ESP32-S3R8 (16 MB flash,
;   8 MB octal PSRAM), so this env targets the generic ESP32-S3 dev board
;   and overrides flash/PSRAM to match the StopWatch. All display, button,
;   power and sensor access goes through M5Unified/M5GFX, which detect and
;   drive the StopWatch hardware at runtime — the generic board definition
;   only sets the chip, flash and memory map.
;   In the Arduino IDE the equivalent is: install the M5Stack core (>= 3.3.7)
;   and select board "M5StopWatch", with M5Unified >= 0.2.15 / M5GFX >= 0.2.21.
;   When an official PlatformIO board def lands, swap `board =` below.

[env:pocket-pip]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; BLE fallback ships feature-flagged OFF until it is compile- and
    ; hardware-verified. See src/main.cpp, search POCKETPIP_ENABLE_BLE.
    -DPOCKETPIP_ENABLE_BLE=0
lib_deps =
    m5stack/M5Unified @ ^0.2.4
    m5stack/M5GFX @ ^0.2.0
    bblanchon/ArduinoJson @ ^7.2.0

; BLE build: same firmware with the NimBLE fallback transport enabled.
; Kept as a separate env so the default build stays lean while the BLE
; path is verified. Build with:  pio run -e pocket-pip-ble
[env:pocket-pip-ble]
extends = env:pocket-pip
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPOCKETPIP_ENABLE_BLE=1
lib_deps =
    m5stack/M5Unified @ ^0.2.4
    m5stack/M5GFX @ ^0.2.0
    bblanchon/ArduinoJson @ ^7.2.0
    h2zero/NimBLE-Arduino @ ^2.2.0
